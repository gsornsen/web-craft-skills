<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host page</title>
<style>
  body{margin:0;padding:16px;font-family:system-ui,sans-serif}
  .card{width:900px;max-width:100%;overflow:hidden;border:1px solid #ccd;border-radius:12px;padding:8px;box-sizing:border-box}
  @media (max-width:480px){.card{width:280px}}
  .card svg{width:100%;height:auto;display:block}
  .card text{font-size:12px;fill:#1a2333}
</style></head><body>
<h1>Ingest pipeline</h1>
<div class="card">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Ingest pipeline: collector, queue, store">
  <rect x="40" y="140" width="200" height="120" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <rect x="300" y="140" width="200" height="120" rx="12" fill="#e6f6ec" stroke="#2f9e5b" stroke-width="2"/>
  <rect x="560" y="140" width="200" height="120" rx="12" fill="#fff4e0" stroke="#d98b1f" stroke-width="2"/>
  <path d="M240 200 H300 M500 200 H560" stroke="#44506b" stroke-width="3" fill="none"/>
  <text x="140" y="205" text-anchor="middle">Collector</text>
  <text x="400" y="205" text-anchor="middle">Queue</text>
  <text x="660" y="205" text-anchor="middle">Store</text>
</svg>
</div>
</body></html>
