<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status board (clean a11y fixture)</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #fff; color: #1a1a1a; }
  header, main, footer { max-width: 640px; margin: 0 auto; padding: 16px 24px; }
  .note { color: #4a4a4a; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: #1f7a3a; }
  .dot.fail { background: #b3261e; }
  button { min-width: 44px; min-height: 44px; padding: 8px 14px; font: inherit; color: #111; background: #f2f2f2; border: 2px solid #444; border-radius: 6px; }
  button:focus-visible, a:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
  #panel[hidden] { display: none; }
  #panel { margin-top: 8px; padding: 8px; border: 1px solid #767676; }
  a { color: #0b57d0; display: inline-block; min-height: 24px; min-width: 24px; }
</style>
</head>
<body>
<header><p class="note">Service dashboard</p></header>
<main>
  <h1>Service status</h1>
  <p class="note">Last checked a few minutes ago.</p>
  <div class="row"><span class="dot ok" role="img" aria-label="status: operational"></span> API gateway (operational)</div>
  <div class="row"><span class="dot fail" role="img" aria-label="status: failing"></span> Billing worker (failing)</div>
  <div class="row">
    <span id="maint-label">Maintenance mode</span>
    <button type="button" role="switch" aria-checked="false" aria-labelledby="maint-label" id="maint"
      onclick="var on=this.getAttribute('aria-checked')==='true';this.setAttribute('aria-checked',String(!on));this.textContent=on?'Off':'On'">Off</button>
  </div>
  <button id="menu-btn" type="button" aria-expanded="false" aria-controls="panel"
    onclick="var p=document.getElementById('panel');p.hidden=!p.hidden;this.setAttribute('aria-expanded',String(!p.hidden))">Menu</button>
  <div id="panel" hidden>
    <a id="cart-link" href="#cart" aria-label="Open cart">Cart</a>
  </div>
</main>
<footer><p class="note">Fixture footer</p></footer>
</body>
</html>
