<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Honest chart</title>
<style>
body{margin:0;padding:20px;font:14px sans-serif}
.chart{display:flex;align-items:flex-end;gap:40px;height:260px;border-bottom:2px solid #333;width:400px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bar{width:60px;background:#3b6ea5}
.val{margin-bottom:4px;font-weight:600}
.name{text-align:center;margin-top:6px}
.names{display:flex;gap:40px;width:400px}.names div{width:60px;text-align:center}
</style></head><body>
<div class="chart">
 <div class="col"><div class="val">10</div><div class="bar" style="height:50px"></div></div>
 <div class="col"><div class="val">20</div><div class="bar" style="height:100px"></div></div>
 <div class="col"><div class="val">40</div><div class="bar" style="height:200px"></div></div>
</div>
<div class="names"><div>A</div><div>B</div><div>C</div></div>
</body></html>
